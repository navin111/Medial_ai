kind = "web"
previewPath = "/"
title = "AI Professional Portfolio"
version = "1.0.0"
id = "artifacts/ai-portfolio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20687

[services.development]
run = "pnpm --filter @workspace/ai-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-portfolio", "run", "build" ]
publicDir = "artifacts/ai-portfolio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20687"
BASE_PATH = "/"
